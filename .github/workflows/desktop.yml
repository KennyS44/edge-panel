name: Desktop

# Kenny has no terminal: the app is checked and the installers are built here,
# then attached to a GitHub Release he can download in a browser.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    name: Boot the app headless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      # a window cannot be unit-tested, so start the real app on a virtual
      # screen and let it check its own geometry
      - name: Start on a virtual screen
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" npx electron . --no-sandbox --smoke

  build:
    name: Installer for ${{ matrix.os }}
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: EdgePanel-windows
          - os: macos-latest
            artifact: EdgePanel-macos
          - os: ubuntu-latest
            artifact: EdgePanel-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Build the installer
        run: npx electron-builder --publish never

      # what the install folder will actually look like
      - name: Show the packaged layout
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "top level:"; ls dist/win-unpacked
          echo "files at top level: $(ls -1 dist/win-unpacked | wc -l)"
          echo "locales: $(ls -1 dist/win-unpacked/locales | wc -l)"
          echo "resources:"; ls dist/win-unpacked/resources

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
